services:
  postgres:
    image: postgres:18
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: neeraj
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: acm_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
